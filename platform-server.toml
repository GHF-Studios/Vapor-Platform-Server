[platform_server]
name = "Vapor Platform Server"
status = "pre-dns-deployed"
public_domain = "vapor.ghf-studios.site"

[deployment]
baseline_os = "ubuntu-26.04-lts"
reverse_proxy = "caddy"
service_manager = "systemd"
panel = "none"
source_branch = "main"

[database]
initial_engine = "sqlite"
state_root = "/var/lib/vapor-server"

[[services]]
id = "homepage"
repo = "https://github.com/GHF-Studios/Vapor-Homepage-Server.git"
path = "Vapor-Homepage-Server"
route = "/"
state = "stateless"

[[services]]
id = "docs"
repo = "https://github.com/GHF-Studios/Vapor-Docs-Server.git"
path = "Vapor-Docs-Server"
route = "/docs/"
state = "docs-artifacts"

[[services]]
id = "identity"
repo = "https://github.com/GHF-Studios/Vapor-Identity-Server.git"
path = "Vapor-Identity-Server"
route = "/api/identity/"
state = "identity-registry"

[[services]]
id = "diagnostics"
repo = "https://github.com/GHF-Studios/Vapor-Diagnostics-Server.git"
path = "Vapor-Diagnostics-Server"
route = "/api/diagnostics/"
state = "diagnostics-uploads"

[[services]]
id = "registry"
repo = "https://github.com/GHF-Studios/Vapor-Registry-Server.git"
path = "Vapor-Registry-Server"
route = "/api/registry/"
state = "registry"
