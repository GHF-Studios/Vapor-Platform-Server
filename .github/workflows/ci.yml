name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  root-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run Platform Server test recipe
        run: deploy/scripts/test.sh
