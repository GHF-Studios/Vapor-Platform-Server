name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  root-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run Platform Server test recipe
        run: deploy/scripts/test.sh

  windows-recovery-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deployment helper tests
        shell: pwsh
        run: python -m unittest discover -s deploy/tests -p 'test_*.py'

      - name: Test owner-held USB recovery sync
        shell: pwsh
        run: ./deploy/tests/test_backup_to_usb.ps1

      - name: Test source-pinned state-only USB recovery kit
        shell: pwsh
        run: ./deploy/tests/test_backup_state_only_to_usb.ps1

      - name: Test USB recovery task triggers
        shell: pwsh
        run: ./deploy/tests/test_usb_backup_task.ps1
