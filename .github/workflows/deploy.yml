name: Request Vapor Platform deployment approval

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vapor-platform-deploy-request
  cancel-in-progress: false

jobs:
  tested-revision:
    name: Require composed Platform CI
    uses: ./.github/workflows/ci.yml

  request-approval:
    name: Create pending deploy request
    needs: tested-revision
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out the exact tested revision and submodule pins
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check request credentials
        id: request-secrets
        env:
          VAPOR_DEPLOY_REQUEST_TOKEN: ${{ secrets.VAPOR_DEPLOY_REQUEST_TOKEN }}
          VAPOR_DEPLOY_PUBLIC_BASE: ${{ vars.VAPOR_DEPLOY_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          if [[ -z "${VAPOR_DEPLOY_REQUEST_TOKEN}" || -z "${VAPOR_DEPLOY_PUBLIC_BASE}" ]]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::CI passed; pending deploy request skipped because VAPOR_DEPLOY_REQUEST_TOKEN or VAPOR_DEPLOY_PUBLIC_BASE is missing"
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Submit exact revision for root approval
        if: steps.request-secrets.outputs.configured == 'true'
        env:
          VAPOR_DEPLOY_REQUEST_TOKEN: ${{ secrets.VAPOR_DEPLOY_REQUEST_TOKEN }}
          VAPOR_DEPLOY_PUBLIC_BASE: ${{ vars.VAPOR_DEPLOY_PUBLIC_BASE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os, subprocess

          root_tree = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^{{tree}}"], text=True
          ).strip()
          pins = []
          for line in subprocess.check_output(
              ["git", "ls-tree", os.environ["GITHUB_SHA"]], text=True
          ).splitlines():
              metadata, path = line.split("\t", 1)
              mode, kind, commit = metadata.split()
              if mode == "160000" and kind == "commit":
                  pins.append({"path": path, "commit": commit})
          payload = {
              "server_mode": "services",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "tree": root_tree,
              "submodules": sorted(pins, key=lambda item: item["path"]),
              "workflow_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "summary": "Platform CI passed; target is independent services.",
          }
          print(json.dumps(payload, separators=(",", ":")))
          PY
          )"
          response_file="$(mktemp)"
          trap 'rm -f -- "${response_file}"' EXIT
          status="$(curl --silent --show-error --connect-timeout 5 --max-time 30 --output "${response_file}" --write-out '%{http_code}' \
            --request POST \
            --header "authorization: Bearer ${VAPOR_DEPLOY_REQUEST_TOKEN}" \
            --header 'content-type: application/json' \
            --data "${payload}" \
            "${VAPOR_DEPLOY_PUBLIC_BASE%/}/api/admin/deploy-requests")"
          if [[ "${status}" != "202" ]]; then
            echo "deploy request was not accepted (HTTP ${status})" >&2
            cat "${response_file}" >&2
            exit 1
          fi
          echo "Pending root approval request created."
