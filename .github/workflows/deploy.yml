name: Request Vapor Platform deployment approval

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**'
      - 'deploy/tests/**'
      - 'deploy/scripts/deployment_scope.py'
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target from the tested Platform composition
        required: true
        type: choice
        default: full
        options:
          - full
          - atlas
          - homepage
          - docs
          - identity
          - diagnostics
          - registry
          - artifact
          - build-cache

permissions:
  contents: read

concurrency:
  group: vapor-platform-deploy-request
  cancel-in-progress: false

jobs:
  tested-revision:
    name: Require composed Platform CI
    uses: ./.github/workflows/ci.yml
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'

  request-approval:
    name: Create pending deploy request
    needs: tested-revision
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Check out the exact tested revision and submodule pins
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve deployment target
        id: deployment_target
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TARGET: ${{ inputs.target }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            target="${DISPATCH_TARGET}"
          elif [[ "${PUSH_BASE}" =~ ^0+$ ]]; then
            target="full"
          else
            target="$(git diff --name-only "${PUSH_BASE}" "${PUSH_HEAD}" | python3 deploy/scripts/deployment_scope.py)"
          fi
          echo "target=${target}" >> "${GITHUB_OUTPUT}"
          echo "Resolved deployment target: ${target}"

      - name: Check request credentials
        id: request_secrets
        if: steps.deployment_target.outputs.target != 'none'
        env:
          VAPOR_DEPLOY_REQUEST_TOKEN: ${{ secrets.VAPOR_DEPLOY_REQUEST_TOKEN }}
          VAPOR_DEPLOY_PUBLIC_BASE: https://vapor.ghf-studios.site
        run: |
          set -euo pipefail
          if [[ -z "${VAPOR_DEPLOY_REQUEST_TOKEN}" ]]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::CI passed; pending deploy request skipped because VAPOR_DEPLOY_REQUEST_TOKEN is missing"
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Submit exact revision for root approval
        if: steps.request_secrets.outputs.configured == 'true' && steps.deployment_target.outputs.target != 'none'
        env:
          VAPOR_DEPLOY_REQUEST_TOKEN: ${{ secrets.VAPOR_DEPLOY_REQUEST_TOKEN }}
          VAPOR_DEPLOY_PUBLIC_BASE: https://vapor.ghf-studios.site
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          VAPOR_REQUEST_TARGET: ${{ steps.deployment_target.outputs.target }}
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os, subprocess

          root_tree = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^{{tree}}"], text=True
          ).strip()
          pins = []
          for line in subprocess.check_output(
              ["git", "ls-tree", os.environ["GITHUB_SHA"]], text=True
          ).splitlines():
              metadata, path = line.split("\t", 1)
              mode, kind, commit = metadata.split()
              if mode == "160000" and kind == "commit":
                  pins.append({"path": path, "commit": commit})
          target = os.environ["VAPOR_REQUEST_TARGET"]
          service_targets = {
              "atlas", "homepage", "docs", "identity", "diagnostics",
              "registry", "artifact", "build-cache",
          }
          if target != "full" and target not in service_targets:
              raise SystemExit("unsupported deployment target")
          scope = "full" if target == "full" else "service"
          payload = {
              "server_mode": "services",
              "deployment_scope": scope,
              "service_target": None if scope == "full" else target,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "tree": root_tree,
              "submodules": sorted(pins, key=lambda item: item["path"]),
              "workflow_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "summary": f"Platform CI passed; deployment target is {target}.",
          }
          print(json.dumps(payload, separators=(",", ":")))
          PY
          )"
          response_file="$(mktemp)"
          trap 'rm -f -- "${response_file}"' EXIT
          status="$(curl --silent --show-error --connect-timeout 5 --max-time 30 --output "${response_file}" --write-out '%{http_code}' \
            --request POST \
            --header "authorization: Bearer ${VAPOR_DEPLOY_REQUEST_TOKEN}" \
            --header 'content-type: application/json' \
            --data "${payload}" \
            "${VAPOR_DEPLOY_PUBLIC_BASE%/}/api/admin/deploy-requests")"
          if [[ "${status}" != "202" ]]; then
            echo "deploy request was not accepted (HTTP ${status})" >&2
            cat "${response_file}" >&2
            exit 1
          fi
          echo "Pending root approval request created."
